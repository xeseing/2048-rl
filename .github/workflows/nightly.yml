name: Nightly heavy gates

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  heavy:
    name: full-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Full differential test (100k games)
        run: python -m game2048.bench.differential --games 100000 --seed 7

      - name: Throughput gate (>= 200k moves/sec)
        run: python -m game2048.bench.engine_bench --seconds 30 --gate 200000

      # Seeds 900000+ are the held-out eval range. Reports are tee'd into the
      # artifact. The default run shell is `bash -e` WITHOUT pipefail, so
      # without the `set` line a failed gate exits 1 and tee turns it into 0.
      - name: Baseline eval (1000 held-out seeds)
        run: |
          set -o pipefail
          mkdir -p runs/_nightly
          python -m game2048.train.evaluate --agent random    --games 1000 --seed-base 900000 | tee runs/_nightly/random.txt
          python -m game2048.train.evaluate --agent heuristic --games 1000 --seed-base 900000 | tee runs/_nightly/heuristic.txt

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval
          path: runs/_nightly/
          # The eval step writes here. An empty upload means it silently
          # stopped writing, which should be loud.
          if-no-files-found: error
