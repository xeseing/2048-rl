[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "2048rl"
dynamic = ["version"]
description = "A 2048 engine and an agent that learns to play it from self-play."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xeseing" }]
dependencies = ["numpy>=1.26"]

# Base install stays numpy-only (SPECS 6.1). [dl] and [tui] arrive with the tasks
# that need them: torch at TASK-15, rich at TASK-21.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.urls]
Homepage = "https://github.com/xeseing/2048-rl"

# Single source of truth for the version: src/game2048/__init__.py. Keeping a second
# copy here is how a tag and a wheel end up disagreeing.
[tool.hatch.version]
path = "src/game2048/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/game2048"]

# Ruff config lives in .ruff.toml, never here — .ruff.toml wins and a [tool.ruff]
# block would be silently ignored. See ADR-007.
[tool.pytest.ini_options]
testpaths = ["tests"]
